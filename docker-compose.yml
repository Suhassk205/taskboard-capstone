name: campusdesk
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campusdesk
      POSTGRES_DB: campusdesk
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U campusdesk -d campusdesk"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    image: campusdesk-backend:local
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: postgres
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      retries: 30
  frontend:
    build: ./frontend
    image: campusdesk-frontend:local
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
