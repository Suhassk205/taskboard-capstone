admin:
  existingSecret: campusdesk-grafana-admin
  userKey: username
  passwordKey: password
service: {type: ClusterIP}
resources:
  requests: {cpu: 25m, memory: 96Mi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus-server.monitoring.svc.cluster.local
      access: proxy
      isDefault: true

grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: monitoring
